# v2 pilot stage A (design.md "v2 pilot"): can each binary operator be learned?
# One node, atoms only (24 unary + the binary operators), 2000 steps; pass = every operator
# >= 98% greedy on its 50 E1 problems (Wilson rule): calibrate.py --e1-only.
base: base.yaml
pretrain:
  level: v2a-atoms
  comp_frac: 0.0
  tree_frac: 0.0
  steps: 2000
  save_at: []
  eval_every: 1000
  eval_sets: [E1]
gate:
  hard_checks: [depth1_greedy]
